name: thusfar_app
description: 页读 / Thusfar — reads only up to your page.
publish_to: none
version: 2.0.13+55

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  thusfar_core:
    path: ../core
  archive: ^4.3.0
  crypto: ^3.0.7
  file_picker: ^10.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-LXGWWenKaiScreen.txt
    - assets/fonts/OFL-NotoSansSC.txt
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Regular.otf
    - family: ZCOOLXiaoWei
      fonts:
        - asset: assets/fonts/ZCOOLXiaoWei-Regular.ttf
    - family: LXGWWenKaiScreen
      fonts:
        - asset: assets/fonts/LXGWWenKaiScreen.ttf
