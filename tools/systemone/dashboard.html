<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>检查看板 · 页读</title>
<style>
:root{--paper:#f5f3ec;--ink:#23352d;--muted:#6c786e;--line:#d7ddd1;--green:#26724f;--pale:#e7ecdf;--orange:#ae633a;--red:#ad4136}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6}main{max-width:1080px;margin:auto;padding:32px 40px 52px}header{display:flex;justify-content:space-between;align-items:center;padding-bottom:21px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:13px;font-size:14px;letter-spacing:.08em}.mark{display:grid;place-items:center;width:33px;height:33px;border-radius:50%;background:var(--ink);color:var(--paper);font-family:"Songti SC","SimSun",serif;font-size:19px}a{color:inherit;text-decoration:none}button,.download{font:inherit;font-size:13px;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:8px 14px;cursor:pointer}button:hover,.download:hover{background:var(--pale)}button:focus-visible,a:focus-visible{outline:3px solid #6e967b;outline-offset:4px}.hero{display:grid;grid-template-columns:1fr 300px;gap:40px;padding:45px 0 34px;align-items:center}.eyebrow{font-size:12px;letter-spacing:.15em;color:var(--muted);margin:0 0 16px}.state{display:flex;align-items:center;gap:10px;color:var(--green);font-size:13px;margin-bottom:12px}.dot{width:8px;height:8px;background:currentColor;border-radius:50%;box-shadow:0 0 0 5px #26724f0c}h1{font-family:"Songti SC","Noto Serif CJK SC","SimSun",serif;font-weight:500;font-size:43px;letter-spacing:.035em;line-height:1.35;margin:0 0 12px}p{margin:0}.lead{color:var(--muted);font-size:14px;min-height:24px}.machine{padding:20px 22px;background:var(--pale);border-top:3px solid var(--green);border-radius:2px}.machine-title{font-size:12px;color:var(--muted)}.machine-name{display:block;font-size:23px;font-weight:600;letter-spacing:.025em;margin:3px 0 15px}.row{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}.row b{font-weight:500;color:var(--ink)}.meter{height:5px;background:#cad3c2;border-radius:3px;overflow:hidden;margin:8px 0 7px}.meter i{height:100%;display:block;background:var(--green);width:0;transition:width .4s}.hint{font-size:11px;color:var(--muted);margin-top:8px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;margin:0 0 36px}.metric{padding:0 24px;border-left:1px solid var(--line)}.metric:first-child{padding-left:0;border:0}.metric label{color:var(--muted);font-size:12px;display:block}.number{font-family:"Baskerville","Georgia",serif;font-size:38px;line-height:1.4;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.unit{font:12px "PingFang SC","Microsoft YaHei",sans-serif;color:var(--muted);margin-left:5px}.metric small{display:block;color:var(--muted);font-size:11px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:19px}h2{font-size:17px;font-weight:600;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:2px}.bars{display:flex;align-items:end;gap:6px;height:64px;padding:0 0 4px;border-bottom:1px solid var(--line);margin-bottom:23px}.bar{flex:1;min-width:3px;max-width:40px;height:2px;background:#7d9e82;border-radius:2px 2px 0 0}.bar.error{background:#c88165}.chart-empty{font-size:12px;color:var(--muted);align-self:center}.records{width:100%;border-collapse:collapse;font-size:13px;text-align:left}.records th{font-weight:400;color:var(--muted);font-size:11px;padding:10px 0;border-bottom:1px solid var(--line)}.records td{padding:13px 0;border-bottom:1px solid #e4e7dd;font-variant-numeric:tabular-nums}.records th:last-child,.records td:last-child{text-align:right}.badge{color:var(--green)}.badge.bad{color:var(--red)}.empty{text-align:center!important;padding:36px 10px!important;color:var(--muted)}.error-note{margin:0 0 24px;padding:12px 16px;border-left:3px solid var(--orange);background:#f0e8da;color:#795239;font-size:13px}.hidden{display:none!important}footer{display:flex;justify-content:space-between;gap:15px;color:var(--muted);font-size:11px;padding-top:24px}#refresh{white-space:nowrap}.stale{color:var(--orange)!important}@media(max-width:640px){main{padding:20px 21px 32px}.hero{grid-template-columns:1fr;gap:25px;padding:31px 0 26px}h1{font-size:35px}.machine{padding:17px 19px}.machine-name{font-size:21px;margin-bottom:9px}.metrics{grid-template-columns:1fr 1fr;padding:0;margin-bottom:27px}.metric{padding:15px 17px!important;border-left:none}.metric:nth-child(odd){padding-left:0!important}.metric:nth-child(even){border-left:1px solid var(--line)}.metric:nth-child(n+3){border-top:1px solid var(--line)}.number{font-size:33px}.records{font-size:12px}.records td{padding:12px 0}.records th:nth-child(3),.records td:nth-child(3){text-align:center}.section-head{align-items:start}.download{padding:6px 10px;white-space:nowrap}footer{display:block}footer span{display:block;margin-top:5px}.bars{gap:4px;height:48px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><main>
<header><a class="brand" href="/v1/decider/dashboard" aria-label="页读检查看板"><span class="mark">页</span><span>页读 / 检查看板</span></a><button id="refresh" type="button">刷新</button></header>
<section class="hero">
<div><p class="eyebrow">DECIDER 0.8B</p><div class="state" id="state"><span class="dot"></span><span id="statusLabel">正在查看状态</span></div><h1 id="headline">让每次检查都有记录。</h1><p class="lead" id="lead">正在连接你的检查服务…</p></div>
<aside class="machine"><span class="machine-title">计算设备</span><strong class="machine-name" id="machine">—</strong><div class="row"><span>整张显卡的显存</span><b id="memory">—</b></div><div class="meter"><i id="memoryBar"></i></div><div class="row"><span id="gpuUsage">正在读取</span><span id="gpuTemp"></span></div><p class="hint" id="memoryNote">这张显卡也供 Qwen 使用。</p></aside>
</section>
<div class="error-note hidden" id="errorNote" role="status"></div>
<section class="metrics" aria-label="检查统计">
<div class="metric"><label>已完成检查</label><div class="number"><span id="checks">—</span><span class="unit">次</span></div><small id="since">从启用记录开始累计</small></div>
<div class="metric"><label>已检查项目</label><div class="number"><span id="questions">—</span><span class="unit">项</span></div><small>每次检查可包含多个项目</small></div>
<div class="metric"><label>最近一次用时</label><div class="number"><span id="duration">—</span><span class="unit">秒</span></div><small id="lastTime">还没有完成记录</small></div>
<div class="metric"><label>正在等候</label><div class="number"><span id="queued">—</span><span class="unit">次</span></div><small id="current">有新任务时会自动开始</small></div>
</section>
<section><div class="section-head"><div><h2>最近的检查</h2><p class="sub" id="historySub">查看每次用时和完成情况</p></div><a class="download" href="/v1/decider/logs" download>下载记录 ↓</a></div>
<div class="bars" id="bars" role="img" aria-label="最近二十次检查的用时"><span class="chart-empty">有记录后，这里会显示用时变化。</span></div>
<table class="records"><thead><tr><th>时间</th><th>完成情况</th><th>项目</th><th>用时</th></tr></thead><tbody id="records"><tr><td class="empty" colspan="4">正在读取记录…</td></tr></tbody></table>
</section><footer><span>仅记录时间和完成情况，不记录书籍内容。</span><span id="updated" aria-live="polite">每 5 秒自动更新</span></footer>
</main>
<script>
const $=id=>document.getElementById(id), fmt=n=>new Intl.NumberFormat('zh-CN').format(n), tm=t=>new Date(t*1000).toLocaleTimeString('zh-CN',{hour12:false}), date=t=>new Date(t*1000).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}), sec=n=>n<10?n.toFixed(2):n.toFixed(1);
const errorText=type=>({TimeoutError:'等待时间过长',URLError:'连接暂时中断',HTTPError:'模型暂时无法完成检查',ConnectionError:'连接暂时中断',ConnectionResetError:'连接暂时中断',ValueError:'这次资料无法完成检查',KeyError:'检查结果不完整'}[type]||'这次检查未完成');
let loading=false,lastData=null;
function cell(text,cls){const td=document.createElement('td');td.textContent=text;if(cls)td.className=cls;return td}
function render(d){lastData=d;const active=d.current,ready=d.ready;
$('machine').textContent=d.machine;
$('statusLabel').textContent=!ready?'暂时连不上':active?'正在检查':'运行正常';
$('state').style.color=ready?'var(--green)':'var(--orange)';
$('headline').textContent=!ready?'检查服务暂时离线。':active?'正在认真检查。':'一切就绪。';
$('lead').textContent=!ready?'服务恢复后，这里的状态会自动更新。':active?`这一批共 ${active.questions} 项，已完成 ${active.done} 项。`:'新任务到来时，会在这里显示进度。';
$('checks').textContent=fmt(d.totals.checks);$('questions').textContent=fmt(d.totals.questions);$('queued').textContent=fmt(d.queued);$('since').textContent=`从 ${date(d.totals.since)} 开始累计`;
$('current').textContent=active?`这一批已用 ${sec(active.seconds)} 秒`:'有新任务时会自动开始';
const latest=d.history[0];$('duration').textContent=latest?sec(latest.seconds):'—';$('lastTime').textContent=latest?`${tm(latest.at)} ${latest.event==='completed'?'完成':'未完成'}`:'还没有完成记录';
const gpu=d.hardware,fresh=d.hardware_at&&d.now-d.hardware_at<20;
if(gpu){$('memory').textContent=`${(gpu.used_mib/1024).toFixed(1)} / ${(gpu.total_mib/1024).toFixed(1)} GB`;$('memoryBar').style.width=`${Math.min(100,gpu.used_mib/gpu.total_mib*100)}%`;$('gpuUsage').textContent=gpu.util_pct==null?'':'使用率 '+Math.round(gpu.util_pct)+'%';$('gpuTemp').textContent=gpu.temp_c==null?'':Math.round(gpu.temp_c)+'°C';$('memoryNote').textContent=fresh?'这张显卡也供 Qwen 使用。':`显卡数据暂未更新，上次读取于 ${tm(d.hardware_at)}。`}
else{$('memory').textContent='暂未读到';$('gpuUsage').textContent='稍后会自动更新';$('gpuTemp').textContent=''}
$('memoryNote').classList.toggle('stale',!fresh);
const failure=d.history.find(r=>r.event==='failed');$('errorNote').classList.toggle('hidden',!failure);if(failure)$('errorNote').textContent=`最近一次问题：${tm(failure.at)}，${errorText(failure.error_type)}。后续完成情况见下方记录。`;
$('historySub').textContent=d.totals.failures?`累计 ${fmt(d.totals.failures)} 次未完成 · 保留最近 100 条记录`:'最近记录会在重新启动后保留';
$('records').replaceChildren();if(!d.history.length){const tr=document.createElement('tr'),td=cell('还没有检查记录。下一次检查完成后会显示在这里。','empty');td.colSpan=4;tr.append(td);$('records').append(tr)}
for(const r of d.history.slice(0,20)){const tr=document.createElement('tr');tr.append(cell(`${date(r.at)} ${tm(r.at)}`),cell(r.event==='completed'?'已完成':errorText(r.error_type),'badge'+(r.event==='failed'?' bad':'')),cell(`${r.done} / ${r.questions}`),cell(`${sec(r.seconds)} 秒`));$('records').append(tr)}
$('bars').replaceChildren();const rows=d.history.slice(0,20).reverse(),max=Math.max(...rows.map(r=>r.seconds),1);if(!rows.length){const s=document.createElement('span');s.className='chart-empty';s.textContent='有记录后，这里会显示用时变化。';$('bars').append(s)}for(const r of rows){const bar=document.createElement('div');bar.className='bar'+(r.event==='failed'?' error':'');bar.style.height=Math.max(5,r.seconds/max*100)+'%';bar.title=`${tm(r.at)} · ${sec(r.seconds)} 秒`;$('bars').append(bar)}
$('updated').textContent=`${tm(d.now)} 更新 · 每 5 秒自动刷新`;$('updated').classList.remove('stale');}
async function refresh(){if(loading)return;loading=true;$('refresh').disabled=true;try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),6000);let response;try{response=await fetch(new URL('dashboard.json',location.href.replace(/dashboard\/$/,'dashboard')),{cache:'no-store',signal:controller.signal})}finally{clearTimeout(timer)}if(!response.ok)throw new Error('offline');render(await response.json())}catch(e){$('updated').textContent='暂时无法刷新，正在自动重试';$('updated').classList.add('stale');$('statusLabel').textContent='看板连接中断';$('state').style.color='var(--orange)';if(!lastData){$('headline').textContent='暂时连不上看板。';$('lead').textContent='连接恢复后，会自动显示最新情况。';$('records').replaceChildren();const tr=document.createElement('tr'),td=cell('稍后会自动重试。','empty');td.colSpan=4;tr.append(td);$('records').append(tr)}}finally{loading=false;$('refresh').disabled=false}}
$('refresh').addEventListener('click',refresh);refresh();setInterval(()=>{if(!document.hidden)refresh()},5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></body></html>
