name: client checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve client dependencies
        working-directory: app
        run: flutter pub get
      - name: Resolve Dart engine dependencies
        working-directory: core
        run: dart pub get --enforce-lockfile
      - name: Analyze Dart engine
        working-directory: core
        run: dart analyze --fatal-infos --fatal-warnings
      - name: Analyze Flutter app
        working-directory: app
        run: flutter analyze --no-fatal-infos
      - name: Install pinned font for screenshot tests
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --location --retry 3 \
            --output "$HOME/.local/share/fonts/NotoSansSC.ttf" \
            'https://raw.githubusercontent.com/google/fonts/2894aab31764f10f29c421bdfd2340d3b382d384/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf'
          echo 'a3041811a78c361b1de50f953c805e0244951c21c5bd412f7232ef0d899af0da  '"$HOME/.local/share/fonts/NotoSansSC.ttf" | sha256sum --check
      - name: Client functional tests
        working-directory: app
        run: |
          flutter test --no-pub \
            test/ask_sheet_test.dart test/backup_test.dart \
            test/foldable_screens_test.dart test/graph_view_test.dart test/import_test.dart \
            test/manual_entities_test.dart test/marginalia_sheet_test.dart \
            test/model_settings_test.dart test/notes_test.dart \
            test/people_search_test.dart test/processing_test.dart \
            test/reader_regression_test.dart test/selection_bounds_test.dart \
            test/screens_test.dart test/shared_import_test.dart \
            test/shelf_processing_action_test.dart \
            test/typography_prefs_test.dart test/typography_sheet_test.dart \
            test/update_checker_test.dart
