name: client checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  flutter:
    # Reviewed widget goldens are rendered on macOS; Linux raster output differs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Record golden rendering environment
        run: |
          mkdir -p app/build/golden-diagnostics
          {
            sw_vers
            uname -m
            flutter --version
            shasum -a 256 app/assets/fonts/*
          } | tee app/build/golden-diagnostics/environment.txt
      - name: Resolve client dependencies
        working-directory: app
        run: flutter pub get
      - name: Resolve Dart engine dependencies
        working-directory: core
        run: dart pub get --enforce-lockfile
      - name: Analyze Dart engine
        working-directory: core
        run: dart analyze --fatal-infos --fatal-warnings
      - name: Processing recovery tests
        working-directory: core
        run: |
          dart test \
            test/jobs/jobs_test.dart test/pipeline/llm_timeout_test.dart \
            test/run_lifecycle/bio_reliability_test.dart \
            test/run_lifecycle/title_spoiler_test.dart \
            test/title_spoilers_test.dart \
            test/services/model_settings_test.dart
      - name: Analyze Flutter app
        working-directory: app
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Install pinned font for screenshot tests
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          cp app/assets/fonts/NotoSansSC.ttf "$HOME/.local/share/fonts/NotoSansSC.ttf"
          echo 'a3041811a78c361b1de50f953c805e0244951c21c5bd412f7232ef0d899af0da  '"$HOME/.local/share/fonts/NotoSansSC.ttf" | shasum -a 256 --check
      - name: Client functional tests
        working-directory: app
        run: |
          flutter test --no-pub \
            test/adaptive_sheet_test.dart test/native_workspace_test.dart \
            test/ask_sheet_test.dart test/backup_test.dart \
            test/chapter_titles_test.dart \
            test/foldable_screens_test.dart test/graph_view_test.dart test/graph_screens_test.dart test/import_test.dart \
            test/manual_entities_test.dart test/marginalia_sheet_test.dart \
            test/model_settings_test.dart test/notes_test.dart \
            test/portable_work_test.dart test/webdav_test.dart \
            test/people_search_test.dart test/processing_test.dart \
            test/processing_diagnostics_test.dart \
            test/reader_regression_test.dart test/selection_bounds_test.dart \
            test/reader_cover_transition_test.dart \
            test/screens_test.dart test/shared_import_test.dart \
            test/shelf_processing_action_test.dart \
            test/typography_prefs_test.dart test/typography_sheet_test.dart \
            test/update_checker_test.dart \
            test/web_reading_boundary_test.dart

      - name: Keep golden failure images and rendering environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-golden-diagnostics
          path: |
            app/test/failures/
            app/build/golden-diagnostics/
          retention-days: 14
          if-no-files-found: warn

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Build offline browser client at a static subpath
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --target lib/main_web.dart --base-href /ux-review/ --no-pub
          python3 web/prepare_offline.py build/web
          mkdir -p build/smoke-root
          mv build/web build/smoke-root/ux-review
      - name: Phone, landscape, tablet and desktop browser flows
        run: |
          python3 -m http.server 18894 --bind 127.0.0.1 --directory app/build/smoke-root > app/build/browser-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time
          import urllib.request
          for attempt in range(40):
              try:
                  urllib.request.urlopen('http://127.0.0.1:18894/ux-review/', timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.25)
          else:
              raise SystemExit('Browser test server did not start')
          PY
          python3 app/test/browser/web_reader_smoke.py \
            --url http://127.0.0.1:18894/ux-review/ \
            --out-dir app/build/browser-smoke
      - name: Keep browser receipts and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: |
            app/build/browser-smoke/
            app/build/browser-http.log
          if-no-files-found: ignore
