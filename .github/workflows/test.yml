name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Python tests (standard library only, no network)
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: JavaScript tests
        run: for f in tests/*.test.mjs; do node "$f"; done
      - name: Interface translations
        run: python scripts/check_i18n.py
