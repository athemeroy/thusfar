name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Parser and special golden provenance records this exact Python patch version.
      - uses: actions/setup-python@v5
        with: { python-version: '3.11.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Python tests (standard library only, no network)
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: A0 oracle and port ledgers
        run: |
          python docs/port/generate_inventory.py --check
          python docs/port/regex_audit.py --check
          python docs/port/manifest.py --list-pending
          python core/tool/generate_ported_tests.py --check
          python oracle/corpus/build.py --verify
          python oracle/corpus/annotate_snapshot.py --verify
          python -m oracle.semantics.regex_python
          python -m oracle.record.scan oracle
      - name: JavaScript tests
        run: for f in tests/*.test.mjs; do node "$f"; done
      - name: A0 reproducible goldens
        run: |
          python -m oracle.record.special --verify
          python -m oracle.record.parse_books --verify
          python -m oracle.record.verify_book_artifacts
          python -m oracle.record.verify_folds
      - name: Live cassette audit contracts (synthetic, no network)
        run: python -m unittest tests.test_verify_live_cassettes -v
      - name: Checked-in live cassette integrity and budget (read-only, no network)
        run: python -m oracle.record.verify_live_cassettes oracle/cassettes/live --expect-report oracle/record/live-a0-audit.json
      - name: Interface translations
        run: python scripts/check_i18n.py
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Dart dependencies
        working-directory: core
        run: dart pub get --enforce-lockfile
      - name: Dart static analysis
        working-directory: core
        run: dart analyze --fatal-infos --fatal-warnings
      - name: Dart semantic and port tests
        working-directory: core
        run: dart test --reporter=json > dart-test-events.jsonl
      - name: Dart test counts
        working-directory: core
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          with open('dart-test-events.jsonl', encoding='utf-8') as source:
              events = [json.loads(line) for line in source]
          completed = [event for event in events if event.get('type') == 'testDone']
          counts = Counter(event['result'] for event in completed)
          passed = sum(event['result'] == 'success' and not event['skipped'] for event in completed)
          skipped = sum(event['skipped'] for event in completed)
          print({'passed': passed, 'skipped': skipped,
                 'failed': counts['failure'] + counts['error']})
          assert passed > 0 and counts['failure'] == counts['error'] == 0
          PY
