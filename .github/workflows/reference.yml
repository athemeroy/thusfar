name: regression reference
on: [push, pull_request]

permissions:
  contents: read

jobs:
  reference-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify retired distribution and retained reference paths
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/reference:$GITHUB_WORKSPACE"
          python scripts/check_reference_layout.py
          python core/tool/generate_ported_tests.py --check
          python reference/docs/port/check_test_scope.py
          python scripts/generate_book_policy_tables.py --check
          python -m unittest discover -s reference/tests -p 'test_ported_contract_guard.py'
          python -m unittest discover -s reference/tests -p 'test_verify_function_goldens.py'
          cd reference
          python -m oracle.record.verify_folds

  dart-reference-audit:
    name: Full Dart historical audit (non-blocking results)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve Dart engine dependencies
        working-directory: core
        run: dart pub get --enforce-lockfile
      - name: Analyze full engine and regression suite
        working-directory: core
        run: dart analyze --fatal-infos --fatal-warnings
      - name: Run every existing Dart assertion without changing skips
        id: full_dart_audit
        continue-on-error: true
        working-directory: core
        run: |
          set -o pipefail
          dart test -j 1 2>&1 | tee ../dart-reference-audit.log
      - name: Report historical audit outcome explicitly
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.full_dart_audit.outcome }}
        run: |
          {
            echo '## Full Dart historical audit'
            echo "Test command outcome: **$AUDIT_OUTCOME**"
            echo 'This additional audit runs all existing tests. Its result is non-blocking because the original source tree already fails six historical model/cassette expectations. The required client/recovery/browser checks remain unchanged.'
            echo 'A successful audit job is not a claim that the full historical suite passed. Inspect the test step and retained complete log for every failure.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$AUDIT_OUTCOME" = failure ]; then
            echo '::warning::Full Dart historical audit reported failures. See the test step, job summary, and dart-reference-audit artifact; no assertions were skipped or loosened.'
          fi
      - name: Keep complete historical audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dart-reference-audit
          path: dart-reference-audit.log
          retention-days: 14
          if-no-files-found: warn
